[project]
name = "congestion-pricing"
version = "0.1.0"
description = "Urban congestion pricing modeling framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Congestion Pricing Team"}
]
keywords = ["transportation", "congestion", "pricing", "traffic", "modeling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "networkx>=3.2",
    "geopandas>=0.14",
    "shapely>=2.0",
    "osmnx>=1.7",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "typer>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "requests>=2.31",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.5",
]
ml = [
    "lightgbm>=4.1",
    "statsmodels>=0.14",
    "cvxpy>=1.4",
]
viz = [
    "matplotlib>=3.8",
    "plotly>=5.18",
    "streamlit>=1.28",
]
all = [
    "congestion-pricing[dev,ml,viz]",
]

[project.scripts]
congestion-pricing = "congestion_pricing.cli:app"

[project.urls]
Repository = "https://github.com/org/congestion-pricing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/congestion_pricing"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=congestion_pricing --cov-report=term-missing"
pythonpath = ["src"]
